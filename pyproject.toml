[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "testbreaker"
version = "0.1.0"
description = "Run a known-bad Python patch against a repository's real test suite."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
testbreaker = "testbreaker.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]

[tool.ruff]
target-version = "py312"
line-length = 100
